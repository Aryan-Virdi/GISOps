<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projection Lab</title>
<script src="https://unpkg.com/deck.gl@9.1.4/dist.min.js"></script>
<style>
:root{--ink:#1d2433;--paper:#eef1f4;--line:#cdd4dc;--accent:#0b5cad}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:15px/1.45 system-ui,sans-serif;color:var(--ink);background:var(--paper)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 8px 0 0}
select,button{font:inherit;padding:6px 12px;border:1px solid #8a94a3;background:#fff;border-radius:4px}
button.go{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}
select:focus-visible,button:focus-visible{outline:3px solid #f5b800;outline-offset:1px}
#status{color:#506070}
#stage{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:#fafbfc}
#legend{position:absolute;left:12px;bottom:12px;background:#fffffff2;border:1px solid var(--line);padding:10px 14px;max-width:300px;font-size:13px}
#legend div{display:flex;align-items:center;gap:8px;margin:2px 0}
.sw{width:12px;height:12px;border-radius:50%;flex:none}
#cards{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;z-index:5}
#cards.hide{display:none}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line)}
.bar h2{margin:0;font-size:20px}
#x{font-size:24px;line-height:1;padding:2px 12px;cursor:pointer}
#list{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px;align-items:center}
.card{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-left:5px solid var(--accent);padding:12px 16px}
.card h3{margin:0 0 4px;font-size:16px}
.card small{color:#506070;display:block}
.empty{color:#506070;margin-top:24px}
</style>
</head>
<body>
<header>
  <h1>Projection Lab</h1>
  <label>Display projection
    <select id="srs">
      <option value="3310">California Albers (EPSG:3310)</option>
      <option value="3857">Web Mercator (EPSG:3857)</option>
      <option value="4326">Raw WGS84 degrees (EPSG:4326)</option>
    </select>
  </label>
  <button class="go" id="clip">Run spatial clip</button>
  <span id="status">Click a field to list its sightings. Hover for coordinates.</span>
</header>
<div id="stage">
  <div id="map"></div>
  <div id="legend" hidden></div>
  <section id="cards" class="hide" aria-label="Sightings in field">
    <div class="bar"><h2 id="ct"></h2><button id="x" aria-label="Close and return to map">&times;</button></div>
    <div id="list"></div>
  </section>
</div>
<script>
const $ = (id) => document.getElementById(id);
const COLORS = [[54,124,43],[205,115,20],[40,100,175],[150,50,130]];
const GREY = [110,118,130], PLAIN = [30,40,60];
let data, assign = null, clipRev = 0, deckgl;

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (n) => Number(n).toLocaleString(undefined, { maximumFractionDigits: 4 });
const fieldColor = (id) => COLORS[data.fields.features.find((f) => f.properties.id === id).properties.idx % COLORS.length];

function viewState() {
  const xs = [], ys = [];
  data.fields.features.forEach((f) => f.geometry.coordinates[0].forEach(([x, y]) => { xs.push(x); ys.push(y); }));
  data.sightings.features.forEach((f) => { xs.push(f.geometry.coordinates[0]); ys.push(f.geometry.coordinates[1]); });
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const k = Math.min($('map').clientWidth / (x1 - x0), $('map').clientHeight / (y1 - y0)) * 0.8;
  return { target: [(x0 + x1) / 2, (y0 + y1) / 2, 0], zoom: Math.log2(k) };
}

function sightingColor(f) {
  if (!assign) return PLAIN;
  const fid = assign[f.properties.id];
  return fid ? fieldColor(fid) : GREY;
}

function layers() {
  return [
    new deck.GeoJsonLayer({
      id: 'fields', data: data.fields, pickable: true, autoHighlight: true, highlightColor: [245,184,0,90],
      getFillColor: (f) => [...COLORS[f.properties.idx % COLORS.length], 55],
      getLineColor: (f) => [...COLORS[f.properties.idx % COLORS.length], 255],
      getLineWidth: 2, lineWidthUnits: 'pixels',
      onClick: ({ object }) => openField(object),
    }),
    new deck.GeoJsonLayer({
      id: 'sightings', data: data.sightings, pickable: true, pointType: 'circle',
      getPointRadius: 6, pointRadiusUnits: 'pixels',
      getFillColor: sightingColor, getLineColor: [255,255,255], getLineWidth: 1.5, lineWidthUnits: 'pixels',
      updateTriggers: { getFillColor: [clipRev] },
    }),
  ];
}

function tooltip({ object }) {
  if (!object) return null;
  const p = object.properties;
  const html = p.label
    ? `<b>${esc(p.label)}</b><br>WGS84: ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}<br>Projected: ${fmt(p.x)}, ${fmt(p.y)}`
    : `<b>${esc(p.name)}</b> (${esc(p.crop)})<br>${p.acres} acres (geodesic)`;
  return { html, style: { background: '#1d2433', color: '#fff', fontSize: '12px', borderRadius: '4px' } };
}

async function load() {
  $('status').textContent = 'Loading...';
  const r = await fetch('/api/features?srid=' + $('srs').value);
  if (!r.ok) { $('status').textContent = 'Failed to load features (' + r.status + ').'; return; }
  data = await r.json();
  const vs = viewState();
  if (!deckgl) {
    deckgl = new deck.Deck({ parent: $('map'), views: new deck.OrthographicView({ flipY: false }),
      initialViewState: vs, controller: true, layers: layers(), getTooltip: tooltip });
  } else {
    deckgl.setProps({ initialViewState: { ...vs, transitionDuration: 400 }, layers: layers() });
  }
  $('status').textContent = $('srs').selectedOptions[0].textContent + ' - coordinates computed by PostGIS ST_Transform.';
}

async function runClip() {
  $('status').textContent = 'Running ST_Intersects join...';
  const r = await fetch('/api/clip');
  if (!r.ok) { $('status').textContent = 'Clip failed (' + r.status + ').'; return; }
  assign = (await r.json()).assignments;
  clipRev++;
  deckgl.setProps({ layers: layers() });
  const counts = {}; let outside = 0;
  Object.values(assign).forEach((fid) => { if (fid) counts[fid] = (counts[fid] || 0) + 1; else outside++; });
  const lg = $('legend'); lg.hidden = false; lg.innerHTML = '';
  const row = (color, text) => {
    const d = document.createElement('div'), sw = document.createElement('span');
    sw.className = 'sw'; sw.style.background = `rgb(${color})`;
    d.append(sw, text); lg.append(d);
  };
  data.fields.features.forEach((f) => row(fieldColor(f.properties.id), `${f.properties.name}: ${counts[f.properties.id] || 0} sightings`));
  row(GREY, `Outside all fields: ${outside}`);
  $('status').textContent = 'Clip complete.';
}

async function openField(f) {
  if (!f) return;
  const r = await fetch('/api/fields/' + f.properties.id + '/sightings');
  if (!r.ok) { $('status').textContent = 'Could not load sightings (' + r.status + ').'; return; }
  const d = await r.json();
  $('ct').textContent = `${d.field.name} - ${d.sightings.length} sightings`;
  const list = $('list'); list.innerHTML = ''; list.scrollTop = 0;
  if (!d.sightings.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'No sightings inside this field.'; list.append(p); }
  d.sightings.forEach((s) => {
    const c = document.createElement('article'); c.className = 'card';
    const h = document.createElement('h3'); h.textContent = s.label;
    const t = document.createElement('small'); t.textContent = new Date(s.observed_at).toLocaleString();
    const g = document.createElement('small'); g.textContent = `WGS84 ${s.lat.toFixed(5)}, ${s.lon.toFixed(5)}`;
    const n = document.createElement('p'); n.style.margin = '6px 0 0'; n.textContent = s.notes || '';
    c.append(h, t, g, n); list.append(c);
  });
  $('cards').classList.remove('hide');
  $('x').focus();
}

const closeCards = () => $('cards').classList.add('hide');
$('x').onclick = closeCards;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCards(); });
$('srs').onchange = load;
$('clip').onclick = runClip;
load();
</script>
</body>
</html>
